<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生日历</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>学生日历</h1>
        <p>南京 · 日程与备忘</p>
      </div>
      <div id="weather" class="weather" aria-live="polite">正在获取南京天气…</div>
    </header>

    <main class="layout">
      <section class="calendar-panel">
        <div class="cal-toolbar">
          <button type="button" id="prev-month" class="nav-btn" aria-label="上一月">‹</button>
          <div class="cal-heading">
            <h2 id="month-title"></h2>
            <p id="week-meta"></p>
          </div>
          <button type="button" id="next-month" class="nav-btn" aria-label="下一月">›</button>
        </div>
        <div class="weekday-row" id="weekday-row"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <p class="selected-line" id="selected-line"></p>
      </section>

      <section class="memo-panel">
        <div class="memo-head">
          <h2>备忘录</h2>
          <input type="search" id="memo-search" placeholder="按标题搜索" />
        </div>
        <form id="memo-form" class="memo-form">
          <input type="text" id="memo-title" required maxlength="80" placeholder="标题" />
          <select id="memo-type">
            <option value="text">文本</option>
            <option value="image">图片</option>
            <option value="audio">音频</option>
            <option value="video">视频</option>
          </select>
          <textarea id="memo-text" rows="3" placeholder="文本内容"></textarea>
          <input type="file" id="memo-file" hidden />
          <label class="file-label" id="file-label" hidden>
            选择文件
            <span id="file-name"></span>
          </label>
          <label class="remind-label">提醒时间
            <input type="datetime-local" id="memo-remind" />
          </label>
          <button type="submit" class="primary">保存备忘录</button>
        </form>
        <ul id="memo-list" class="memo-list"></ul>
      </section>
    </main>
  </div>

  <div id="viewer" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 id="viewer-title"></h3>
      <div id="viewer-body"></div>
      <button type="button" id="viewer-close" class="primary">关闭</button>
    </div>
  </div>

  <div id="remind-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card remind-card">
      <h3>备忘提醒</h3>
      <p id="remind-text"></p>
      <button type="button" id="remind-ok" class="primary">知道了</button>
    </div>
  </div>

  <script src="js/lunar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
